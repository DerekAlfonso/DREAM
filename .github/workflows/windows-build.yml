name: Desktop builds

# Builds only run for the master branch: on pushes/merges to master, or when
# started by hand from the Actions tab (choose master in the branch picker).
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Computes one version for the whole run: MAJOR.MINOR from <revision> in pom.xml,
  # PATCH = the workflow run number, so every build gets a new, increasing version.
  # (jpackage only accepts up to three numeric parts, so a fourth "build" part is not an option.)
  version:
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.v.outputs.app_version }}
    steps:
      - uses: actions/checkout@v5

      - id: v
        shell: bash
        run: |
          base=$(python3 -c 'import xml.etree.ElementTree as ET; ns={"m":"http://maven.apache.org/POM/4.0.0"}; print(ET.parse("pom.xml").getroot().find("m:properties/m:revision", ns).text)')
          major_minor=$(echo "$base" | cut -d. -f1-2)
          version="${major_minor}.${{ github.run_number }}"
          echo "app_version=$version" >> "$GITHUB_OUTPUT"
          echo "Building version $version"

  windows:
    needs: version
    runs-on: windows-2022
    env:
      APP_VERSION: ${{ needs.version.outputs.app_version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and verify JAR
        run: mvn -B --no-transfer-progress clean verify "-Drevision=$env:APP_VERSION"

      - name: Stage application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/input, dist/output | Out-Null
          Copy-Item target/dream.jar dist/input/dream.jar

      - name: Build portable Windows app with bundled Java
        shell: pwsh
        run: |
          jpackage --type app-image --name DREAM --app-version $env:APP_VERSION `
            --input dist/input --main-jar dream.jar --main-class dream.Main `
            --icon src/main/resources/assets/icons/dream.ico `
            --java-options '-Ddream.packaged=true' --dest dist/output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path dist/output/DREAM/runtime/bin/server/jvm.dll)) { throw 'Bundled Java runtime is missing' }
          if (!(Test-Path dist/output/DREAM/DREAM.exe)) { throw 'Windows launcher is missing' }
          Compress-Archive -Path dist/output/DREAM -DestinationPath "dist/output/DREAM-$env:APP_VERSION-windows-x64-portable.zip"

      - name: Build Windows installer
        shell: pwsh
        run: |
          $wixBin = Join-Path ${env:ProgramFiles(x86)} 'WiX Toolset v3.14\bin'
          if (Test-Path $wixBin) { $env:PATH = "$wixBin;$env:PATH" }
          jpackage --type exe --name DREAM --app-version $env:APP_VERSION `
            --app-image dist/output/DREAM --dest dist/output `
            --icon src/main/resources/assets/icons/dream.ico `
            --win-per-user-install --win-menu --win-shortcut
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-ChildItem dist/output -Filter '*.exe' | Select-Object -First 1
          if (!$exe) { throw 'Installer was not created' }
          Rename-Item $exe.FullName "DREAM-$env:APP_VERSION-windows-x64-setup.exe"

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          path: dist/output/*.exe
          archive: false
          if-no-files-found: error

      - name: Upload portable build
        uses: actions/upload-artifact@v7
        with:
          path: dist/output/*.zip
          archive: false
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    needs: version
    strategy:
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    env:
      APP_VERSION: ${{ needs.version.outputs.app_version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and verify JAR
        run: mvn -B --no-transfer-progress clean verify "-Drevision=$APP_VERSION"

      - name: Stage application
        shell: bash
        run: |
          mkdir -p dist/input dist/output
          cp target/dream.jar dist/input/dream.jar

      - name: Build macOS disk image with bundled Java
        shell: bash
        run: |
          jpackage --type dmg --name DREAM --app-version "$APP_VERSION" \
            --input dist/input --main-jar dream.jar --main-class dream.Main \
            --icon src/main/resources/assets/icons/dream.icns \
            --java-options '-Ddream.packaged=true' --dest dist/output
          dmg=(dist/output/*.dmg)
          test "${#dmg[@]}" -eq 1
          mv "${dmg[0]}" "dist/output/DREAM-${APP_VERSION}-macos-${{ matrix.arch }}.dmg"

      - name: Upload macOS disk image
        uses: actions/upload-artifact@v7
        with:
          path: dist/output/*.dmg
          archive: false
          if-no-files-found: error

  # Workflow artifacts only live on the Actions run page. Publishing them under
  # Releases needs a tag + GitHub Release with the files attached, which needs
  # write access to repo contents. Guarded to master so a manual run started on
  # another branch can't publish a release.
  release:
    needs: [version, windows, macos]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      APP_VERSION: ${{ needs.version.outputs.app_version }}
    steps:
      - name: Download build outputs
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          ls -la release
          gh release create "v${APP_VERSION}" release/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "DREAM ${APP_VERSION}" \
            --generate-notes
